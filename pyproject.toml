[project]
name = "agentic-analyst"
version = "0.1.0"
description = "Ask Questions about KPI series and get Answers whose Claims are checked by code."
requires-python = ">=3.10"
dependencies = []   # standard library only

[project.optional-dependencies]
test = ["pytest>=8"]
# Round 2 KPI triage (src/kpi_triage): data generation, baselines and scoring. GPU runs use opentslm-triage/.
triage = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=15", "openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
