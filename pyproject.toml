[project]
name = "agentic-analyst"
version = "0.1.0"
description = "Ask Questions about KPI series and get Answers whose Claims are checked by code."
requires-python = ">=3.10"
dependencies = []   # standard library only

[project.optional-dependencies]
test = ["pytest>=8"]
# hackathon evaluation (src/tslm_eval); the Q&A package above stays standard-library only
eval = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "matplotlib>=3.8", "anthropic>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
